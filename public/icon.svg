<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Background Decorative Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Dumbbell Icon Group rotated 45 deg for dynamic motion -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#iconShadow)">
    <!-- Central Barbell Shaft -->
    <rect x="236" y="96" width="40" height="320" rx="12" fill="url(#metalGrad)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Shaft Knurling Grip Patterns -->
    <line x1="240" y1="210" x2="272" y2="210" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="226" x2="272" y2="226" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="242" x2="272" y2="242" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="258" x2="272" y2="258" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="274" x2="272" y2="274" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="290" x2="272" y2="290" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="306" x2="272" y2="306" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Top Plate Collar Inner -->
    <rect x="208" y="160" width="96" height="24" rx="8" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2" />
    <!-- Top Inner Weight Plate -->
    <rect x="160" y="126" width="192" height="34" rx="12" fill="url(#plateGrad)" stroke="#3f3f46" stroke-width="3" />
    <!-- Top Outer Weight Plate -->
    <rect x="180" y="90" width="152" height="36" rx="10" fill="#27272a" stroke="#52525b" stroke-width="3" />
    <!-- Top End Cap Nut -->
    <rect x="224" y="68" width="64" height="22" rx="7" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2" />

    <!-- Bottom Plate Collar Inner -->
    <rect x="208" y="328" width="96" height="24" rx="8" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2" />
    <!-- Bottom Inner Weight Plate -->
    <rect x="160" y="352" width="192" height="34" rx="12" fill="url(#plateGrad)" stroke="#3f3f46" stroke-width="3" />
    <!-- Bottom Outer Weight Plate -->
    <rect x="180" y="386" width="152" height="36" rx="10" fill="#27272a" stroke="#52525b" stroke-width="3" />
    <!-- Bottom End Cap Nut -->
    <rect x="224" y="422" width="64" height="22" rx="7" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="2" />

    <!-- Plate Rim Highlights -->
    <line x1="174" y1="134" x2="338" y2="134" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="174" y1="360" x2="338" y2="360" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- AI Sparkle / Fitness Energy Accent in Top-Right Corner -->
  <g transform="translate(380, 100)">
    <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="#ffffff" filter="drop-shadow(0 0 8px rgba(255,255,255,0.8))" />
    <circle cx="0" cy="0" r="6" fill="#a7f3d0" />
  </g>
  <g transform="translate(420, 170) scale(0.5)">
    <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="#ffffff" opacity="0.85" />
  </g>
  <g transform="translate(100, 390) scale(0.6)">
    <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
