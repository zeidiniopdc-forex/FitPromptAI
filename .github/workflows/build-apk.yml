name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

      - name: Locate and Rename APK
        id: locate_apk
        run: |
          mkdir -p build-output
          if [ "${{ github.event.inputs.build_type }}" = "release" ] && [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/fitprompt-ai-release-unsigned.apk
            echo "apk_path=build-output/fitprompt-ai-release-unsigned.apk" >> $GITHUB_OUTPUT
            echo "apk_name=fitprompt-ai-release-unsigned.apk" >> $GITHUB_OUTPUT
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/fitprompt-ai-debug.apk
            echo "apk_path=build-output/fitprompt-ai-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=fitprompt-ai-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "Searching for generated APK files..."
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/ \;
            FIRST_APK=$(ls build-output/*.apk | head -n 1)
            echo "apk_path=$FIRST_APK" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename $FIRST_APK)" >> $GITHUB_OUTPUT
          fi
          ls -la build-output/

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitPrompt-AI-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## 📱 FitPrompt AI - Android APK Release
            - **Commit**: ${{ github.sha }}
            - **Built on**: ${{ github.event.repository.updated_at }}
            - **Features**: AI-Agnostic Workout Program Generator & Active Tracker
            
            ### Installation:
            1. Download `fitprompt-ai-debug.apk`.
            2. Open the file on your Android device.
            3. Allow installation from unknown sources if prompted.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
